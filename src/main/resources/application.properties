spring.application.name=citas-medicas

# Base de datos PostgreSQL (requiere la extensión btree_gist). Valores por variable de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas_medicas}
spring.datasource.username=${DB_USER:citas}
spring.datasource.password=${DB_PASSWORD:citas}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Sesión de servidor guardada en la base de datos (Spring Session JDBC)
spring.session.jdbc.initialize-schema=always

# Zona única del consultorio; las columnas TIMESTAMP no llevan zona
spring.jackson.time-zone=America/Lima
