<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Mi agenda')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('agenda')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Mi agenda</h1>
          <p class="text-body-secondary mb-0" th:text="${#temporals.format(fecha, 'EEEE d ''de'' MMMM ''de'' yyyy')}">Día</p></div>
        <form class="d-flex gap-2" th:action="@{/medico/agenda}" method="get">
          <input type="date" class="form-control" name="fecha" th:value="${fecha}">
          <button class="btn btn-outline-primary">Ver</button>
        </form>
      </div>

      <div class="card shadow-sm mb-3" th:each="c : ${citas}">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <div class="fw-semibold" th:text="|${#temporals.format(c.inicio, 'HH:mm')}–${#temporals.format(c.fin, 'HH:mm')} · ${c.paciente}|">08:00 · Paciente</div>
            <div class="small text-body-secondary" th:text="|${c.tipo} · ${c.duracionMin()} min · ${c.modalidad == 'PRESENCIAL' ? 'Presencial' : 'Teleconsulta'}|">Tipo</div>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <span class="badge" th:classappend="${c.vigente()} ? 'text-bg-secondary' : (${c.asistio()} ? 'text-bg-info' : 'text-bg-light border')"
                  th:text="${c.atencionIniciada and c.asistio()} ? 'En atención' : ${c.estado}">Programada</span>
            <form th:if="${c.asistio() and !c.atencionIniciada}" method="post" th:action="@{/medico/citas/{id}/iniciar(id=${c.idCita})}" class="m-0">
              <input type="hidden" name="fecha" th:value="${fecha}"><button class="btn btn-sm btn-primary">Iniciar atención</button></form>
            <form th:if="${c.asistio() and c.atencionIniciada}" method="post" th:action="@{/medico/citas/{id}/finalizar(id=${c.idCita})}" class="m-0">
              <input type="hidden" name="fecha" th:value="${fecha}"><button class="btn btn-sm btn-success">Finalizar atención</button></form>
            <form th:if="${c.vigente()}" method="post" th:action="@{/medico/citas/{id}/no-asistio(id=${c.idCita})}" class="m-0">
              <input type="hidden" name="fecha" th:value="${fecha}"><button class="btn btn-sm btn-outline-secondary">No asistió</button></form>
            <form th:if="${c.vigente()}" method="post" th:action="@{/medico/citas/{id}/cancelar(id=${c.idCita})}" class="d-flex gap-1 m-0">
              <input type="hidden" name="fecha" th:value="${fecha}">
              <input class="form-control form-control-sm" name="motivo" placeholder="Motivo" style="width:9rem" required>
              <button class="btn btn-sm btn-outline-danger">Cancelar</button></form>
          </div>
        </div>
      </div>
      <p th:if="${#lists.isEmpty(citas)}" class="text-center text-body-secondary my-4">No tienes citas este día.</p>
      <p class="small text-body-secondary">Para iniciar la atención, recepción debe registrar antes la llegada del paciente.</p>
    </main>
  </div>
</div>

<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
