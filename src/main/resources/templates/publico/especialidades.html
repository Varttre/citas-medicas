<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/publico :: head('Especialidades')}"></head>
<body class="bg-body">
<nav th:replace="~{fragmentos/publico :: navegacion('especialidades')}"></nav>

<main class="container py-5">
  <h1 class="h3">Especialidades y médicos</h1>
  <p class="text-body-secondary mb-4">Elige la especialidad y agenda con el médico que prefieras desde tu cuenta.</p>

  <div class="row g-4">
    <div class="col-md-6 col-xl-4" th:each="e : ${especialidades}">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center gap-3 mb-2">
            <span class="icono-especialidad"><i class="bi" th:classappend="${e.icono()}"></i></span>
            <h2 class="h5 mb-0" th:text="${e.nombre}">Especialidad</h2>
          </div>
          <p class="small text-body-secondary" th:if="${e.descripcion}" th:text="${e.descripcion}">Descripción</p>
          <ul class="list-unstyled mb-0" th:unless="${#lists.isEmpty(e.medicos)}">
            <li class="d-flex align-items-center gap-2 py-1" th:each="m : ${e.medicos}">
              <i class="bi bi-person-circle text-body-secondary"></i><span th:text="${m}">Médico</span>
            </li>
          </ul>
          <p class="small text-body-secondary mb-0" th:if="${#lists.isEmpty(e.medicos)}">Próximamente.</p>
        </div>
        <div class="card-footer bg-transparent border-0 pb-3" th:unless="${#lists.isEmpty(e.medicos)}">
          <a th:href="@{/paciente/cita/nueva}" class="btn btn-primary btn-sm"><i class="bi bi-calendar-plus me-1"></i>Agendar cita</a>
        </div>
      </div>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(especialidades)}" class="text-body-secondary">Pronto publicaremos nuestras especialidades.</p>
  <p class="small text-body-secondary mt-4 mb-0">Para agendar te pediremos iniciar sesión. ¿Aún no tienes cuenta? <a th:href="@{/registro}">Regístrate</a>.</p>
</main>

<footer th:replace="~{fragmentos/publico :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
