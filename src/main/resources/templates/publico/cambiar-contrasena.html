<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Nueva contraseña')}"></head>
<body class="bg-body-tertiary">
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8 col-lg-5">
      <a th:href="@{/}" class="d-flex justify-content-center align-items-center gap-2 mb-4 text-decoration-none link-body-emphasis">
        <i class="bi bi-heart-pulse fs-2 text-primary"></i><span class="fs-5 fw-semibold">Consultorio San Isidro</span>
      </a>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Crear una nueva contraseña</h1>
          <p class="text-body-secondary small mb-4">Cuenta: l•••••@correo.com</p>
          <form th:action="@{/login}">
            <div class="mb-3"><label class="form-label">Nueva contraseña</label><input type="password" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Repetir contraseña</label><input type="password" class="form-control"></div>
            <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
          </form>
          <div class="alert alert-light border small mt-3 mb-0">
            <i class="bi bi-shield-lock me-1"></i>Este enlace solo permite cambiar la contraseña: no inicia sesión. Al guardar se cerrarán las sesiones abiertas de tu cuenta y deberás ingresar de nuevo.
          </div>
        </div>
      </div>

    </div>
  </div>
</main>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
