<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Recuperar cuenta')}"></head>
<body class="bg-body-tertiary">
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8 col-lg-5">
      <a th:href="@{/}" class="d-flex justify-content-center align-items-center gap-2 mb-4 text-decoration-none link-body-emphasis">
        <i class="bi bi-heart-pulse fs-2 text-primary"></i><span class="fs-5 fw-semibold">Consultorio San Isidro</span>
      </a>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Olvidé mi contraseña</h1>
          <p class="text-body-secondary small mb-4">Escribe el correo de tu cuenta y te enviaremos un enlace para cambiar la contraseña.</p>
          <form action="#enviado">
            <label class="form-label" for="correo">Correo electrónico</label>
            <input type="email" class="form-control mb-3" id="correo" placeholder="nombre@correo.com">
            <button type="button" class="btn btn-primary w-100" data-bs-toggle="collapse" data-bs-target="#enviado">Recuperar cuenta</button>
          </form>
          <div class="collapse" id="enviado">
            <div class="alert alert-success small mt-3 mb-0">
              Si el correo está registrado, recibirás un enlace en unos minutos. El enlace caduca por sí solo y solo sirve una vez.
            </div>
          </div>
          <div class="d-flex justify-content-between mt-4 small">
            <a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Atrás</a>
            <a th:href="@{/registro}">Registrarse</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</main>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
