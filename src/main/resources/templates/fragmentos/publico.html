<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos de la página pública (sin sesión): cabecera, barra de navegación y pie. Sin patrón de fondo -->

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · ' + ${consultorio}">Consultorio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <script>try { if (localStorage.getItem('tema') === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark'); } catch (e) {}</script>
</head>

<body>

<nav th:fragment="navegacion(seccion)" class="navbar navbar-expand-md bg-body border-bottom">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
      <i class="bi bi-heart-pulse text-primary"></i><span class="fw-semibold" th:text="${consultorio}">Consultorio</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-publico"
            aria-controls="menu-publico" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu-publico">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'inicio'} ? 'active fw-semibold'" th:href="@{/}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'especialidades'} ? 'active fw-semibold'" th:href="@{/especialidades}">Especialidades</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'como-agendar'} ? 'active fw-semibold'" th:href="@{/como-agendar}">Cómo agendar</a></li>
      </ul>
      <div class="d-flex gap-2 py-2 py-md-0">
        <a th:href="@{/login}" class="btn btn-outline-primary">Iniciar sesión</a>
        <a th:href="@{/registro}" class="btn btn-primary">Registrarse</a>
      </div>
    </div>
  </div>
</nav>

<footer th:fragment="pie" class="border-top py-4 mt-5 bg-body-tertiary">
  <div class="container">
    <div class="row g-3 small">
      <div class="col-md-4">
        <div class="fw-semibold mb-1" th:text="${consultorio}">Consultorio</div>
        <div class="text-body-secondary">Atención presencial y teleconsulta</div>
      </div>
      <div class="col-md-4">
        <div><i class="bi bi-geo-alt me-1 text-primary"></i>Av. Camino Real 1234, San Isidro, Lima</div>
        <div><i class="bi bi-clock me-1 text-primary"></i>Lunes a viernes de 8:00 a 19:00</div>
      </div>
      <div class="col-md-4">
        <a class="d-block" th:href="@{/especialidades}">Especialidades y médicos</a>
        <a class="d-block" th:href="@{/como-agendar}">Cómo agendar tu cita</a>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
