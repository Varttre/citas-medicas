<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos comunes a todas las pantallas con sesión. Uso: ver fragmentos/ejemplo.html -->

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · ' + ${consultorio}">Consultorio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <script>try { if (localStorage.getItem('tema') === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark'); } catch (e) {}
    document.documentElement.setAttribute('data-fondo', (function () { try { return localStorage.getItem('fondo'); } catch (e) { return null; } })() || 'puntos');</script>
</head>

<body>

<!-- Barra superior con el botón de menú, solo en el móvil -->
<nav th:fragment="navbarMovil" class="navbar bg-body border-bottom d-lg-none px-3">
  <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#barra-lateral" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </button>
  <span class="fw-semibold" th:text="${consultorio}">Consultorio</span>
  <span></span>
</nav>

<!-- Mensajes flash: exito (verde), error (rojo), aviso (amarillo) -->
<div th:fragment="mensajes">
  <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-octagon me-1"></i><span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div th:if="${enlace}" class="alert alert-info" role="alert">
    <div class="fw-semibold mb-1"><i class="bi bi-link-45deg me-1"></i>Enlace para crear una contraseña nueva</div>
    <div class="input-group input-group-sm">
      <input class="form-control" readonly th:value="${enlace}" id="enlace-recuperacion" onclick="this.select()">
      <button class="btn btn-outline-primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('enlace-recuperacion').value); this.textContent='Copiado'">Copiar</button>
    </div>
    <div class="small mt-1">Entrégaselo a la persona (WhatsApp, impreso o en pantalla). Sirve una sola vez y caduca en 24 horas; generar otro anula este.</div>
  </div>
  <div th:if="${aviso}" class="alert alert-warning alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${aviso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
</div>

<!-- Fondo de las pantallas, elegible en «Mi perfil». Se guarda en este navegador, como el modo oscuro -->
<div th:fragment="selectorFondo" class="card shadow-sm mb-4">
  <div class="card-body p-4">
    <h2 class="h6 text-body-secondary text-uppercase small">Fondo de las pantallas</h2>
    <p class="small text-body-secondary">Un patrón muy suave detrás del contenido. Se aplica al momento y se recuerda en este navegador.</p>
    <div class="d-flex flex-wrap gap-2" role="radiogroup" aria-label="Fondo de las pantallas">
      <th:block th:each="f : ${ {'liso','puntos','cruces','sierra'} }">
        <input type="radio" class="btn-check" name="fondo" th:id="|fondo-${f}|" th:value="${f}" autocomplete="off">
        <label class="btn btn-outline-secondary muestra-fondo" th:for="|fondo-${f}|" th:attr="data-fondo-muestra=${f}">
          <span class="muestra-fondo-cuadro"></span>
          <span class="small" th:text="${f == 'liso' ? 'Liso' : (f == 'puntos' ? 'Puntos' : (f == 'cruces' ? 'Cruces' : 'Sierra'))}">Puntos</span>
        </label>
      </th:block>
    </div>
  </div>
</div>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
