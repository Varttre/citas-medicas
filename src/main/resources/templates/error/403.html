<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin permiso · Consultorio San Isidro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <script th:src="@{/js/app.js}"></script>
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 640px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-shield-lock fs-3 text-warning" aria-hidden="true"></i>
        <h1 class="h4 mb-0">No tienes permiso para ver esta página</h1>
      </div>
      <p class="text-body-secondary">Esta sección pertenece a otro perfil del sistema. Si crees que deberías tener
        acceso, comunícate con la administración del consultorio.</p>
      <div class="d-flex flex-wrap gap-2 mt-4">
        <a sec:authorize="hasRole('PACIENTE')" th:href="@{/paciente/inicio}" class="btn btn-primary">Ir a mi inicio</a>
        <a sec:authorize="hasRole('MEDICO')" th:href="@{/medico/inicio}" class="btn btn-primary">Ir a mi inicio</a>
        <a sec:authorize="hasAnyRole('RECEPCION','ADMINISTRADOR','SUPERADMIN')" th:href="@{/recepcion/inicio}" class="btn btn-primary">Ir a mi inicio</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-primary">Iniciar sesión</a>
        <a th:href="@{/}" class="btn btn-outline-secondary">Página principal</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
