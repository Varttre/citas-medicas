<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Cuando exista fragmentos/base.html, este head se reemplaza por ~{fragmentos/base :: head('No se pudo completar')} -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No se pudo completar · Consultorio San Isidro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 640px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4">No se pudo completar la operación</h1>
      <div class="alert alert-warning my-3" th:text="${mensaje}">Mensaje de la regla</div>
      <a href="javascript:history.back()" class="btn btn-outline-secondary">Volver</a>
      <a th:href="@{/}" class="btn btn-primary">Ir al inicio</a>
    </div>
  </div>
</main>
</body>
</html>
