<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Agenda')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('agenda')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Agenda del día</h1>
          <p class="text-body-secondary mb-0" th:text="|${#temporals.format(fecha, 'EEEE d ''de'' MMMM')} · ${medico == null ? 'todos los médicos' : 'un médico'}|">Día</p></div>
        <a th:href="@{/recepcion/cita/nueva}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nueva cita</a>
      </div>
      <form class="d-flex flex-wrap gap-2 mb-3" th:action="@{/recepcion/agenda}" method="get">
        <input type="date" class="form-control" style="max-width:11rem" name="fecha" th:value="${fecha}">
        <select class="form-select" style="max-width:16rem" name="medico">
          <option value="">Todos los médicos</option>
          <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="|${m.nombre} · ${m.especialidad}|" th:selected="${medico == m.idMedico}">Médico</option>
        </select>
        <button class="btn btn-outline-primary">Ver</button>
      </form>

      <div class="card shadow-sm"><div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light"><tr><th>Hora</th><th>Médico</th><th>Paciente</th><th>Tipo</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
          <tbody>
            <tr th:each="c : ${citas}">
              <td class="fw-semibold text-nowrap" th:text="|${#temporals.format(c.inicio, 'HH:mm')}–${#temporals.format(c.fin, 'HH:mm')}|">08:00</td>
              <td><div th:text="${c.medico}">Médico</div><div class="small text-body-secondary" th:text="${c.especialidad}">Esp</div></td>
              <td><div th:text="${c.paciente}">Paciente</div><div class="small text-body-secondary" th:text="${c.documento}">DNI</div></td>
              <td><div th:text="${c.tipo}">Tipo</div><div class="small text-body-secondary" th:text="|${c.duracionMin()} min · ${c.modalidad == 'PRESENCIAL' ? 'Presencial' : 'Teleconsulta'}|">30 min</div></td>
              <td><span class="badge" th:classappend="${c.vigente()} ? 'text-bg-secondary' : (${c.asistio()} ? 'text-bg-info' : 'text-bg-light border')" th:text="${c.atencionIniciada and c.asistio()} ? 'En atención' : ${c.estado}">Programada</span></td>
              <td class="text-end text-nowrap">
                <form th:if="${c.vigente()}" class="d-inline" method="post" th:action="@{/recepcion/citas/{id}/llegada(id=${c.idCita})}">
                  <input type="hidden" name="fecha" th:value="${fecha}">
                  <button class="btn btn-sm btn-outline-success">Llegó</button></form>
                <form th:if="${c.vigente()}" class="d-inline" method="post" th:action="@{/recepcion/citas/{id}/estado(id=${c.idCita})}">
                  <input type="hidden" name="fecha" th:value="${fecha}"><input type="hidden" name="nuevoEstado" value="NO_ASISTIO">
                  <button class="btn btn-sm btn-outline-secondary">No asistió</button></form>
                <form th:if="${c.asistio() and !c.atencionIniciada}" class="d-inline-flex gap-1" method="post" th:action="@{/recepcion/citas/{id}/estado(id=${c.idCita})}">
                  <input type="hidden" name="fecha" th:value="${fecha}"><input type="hidden" name="nuevoEstado" value="NO_ASISTIO"><input type="hidden" name="asistio" value="true">
                  <input class="form-control form-control-sm" name="motivo" placeholder="Motivo del retiro" style="width:10rem" required>
                  <button class="btn btn-sm btn-outline-warning">Se retiró</button></form>
                <form th:if="${c.vigente()}" class="d-inline-flex gap-1" method="post" th:action="@{/recepcion/citas/{id}/estado(id=${c.idCita})}">
                  <input type="hidden" name="fecha" th:value="${fecha}">
                  <select class="form-select form-select-sm" name="nuevoEstado" style="width:9rem">
                    <option value="CANCELADA_POR_PACIENTE">Cancela el paciente</option>
                    <option value="CANCELADA_POR_CLINICA">Cancela el consultorio</option>
                  </select>
                  <input class="form-control form-control-sm" name="motivo" placeholder="Motivo" style="width:8rem" required>
                  <button class="btn btn-sm btn-outline-danger">Cancelar</button></form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}"><td colspan="6" class="text-center text-body-secondary">No hay citas para este día.</td></tr>
          </tbody>
        </table>
      </div></div>
      <p class="small text-body-secondary mt-2">La llegada se registra desde 30 minutos antes de la cita; la inasistencia, desde 5 minutos después del inicio.</p>
    </main>
  </div>
</div>

<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
