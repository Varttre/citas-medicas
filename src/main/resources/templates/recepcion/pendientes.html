<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Citas pendientes')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('pendientes')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Citas pendientes por agendar</h1><p class="text-body-secondary mb-0">Indicaciones médicas sin agendar, ordenadas por vencimiento</p></div>
        <span class="badge text-bg-primary fs-6" th:text="|${pendientes.size()} pendientes|">0 pendientes</span>
      </div>

      <div class="card shadow-sm">
        <div th:if="${pendientes.isEmpty()}" class="card-body text-body-secondary">No hay citas indicadas pendientes.</div>
        <div class="table-responsive" th:unless="${pendientes.isEmpty()}">
        <table class="table align-middle mb-0">
          <thead class="table-light"><tr><th>Paciente</th><th>Teléfono de contacto</th><th>Indicó</th><th>Tipo</th><th>Fecha recomendada</th><th>Vigencia</th><th></th></tr></thead>
          <tbody>
            <th:block th:each="i : ${pendientes}" th:with="dias=${i.diasRestantes}">
            <tr th:classappend="${dias <= 10} ? 'table-warning'">
              <td class="fw-semibold" th:text="${i.paciente}">Paciente</td>
              <td th:text="${i.telefono ?: '—'}">999</td>
              <td th:text="${i.medico}">Médico</td>
              <td th:text="|${i.tipo} · ${i.duracion} min|">Seguimiento</td>
              <td th:text="${#temporals.format(i.fechaRecomendada, 'dd/MM/yyyy')}">01/12</td>
              <td><span th:classappend="${dias <= 10} ? 'text-danger fw-semibold'" th:text="${dias == 0 ? 'vence hoy' : 'vence en ' + dias + ' días'}">vence</span></td>
              <td class="text-end"><button class="btn btn-sm btn-primary" type="button" data-bs-toggle="collapse" th:data-bs-target="|#llamar${i.idIndicacion}|">Llamar y registrar</button></td>
            </tr>
            <tr class="collapse" th:id="|llamar${i.idIndicacion}|"><td colspan="7" class="bg-body-tertiary">
              <form class="d-flex flex-wrap align-items-end gap-2" method="post" th:action="@{/recepcion/pendientes/{id}/llamada(id=${i.idIndicacion})}">
                <div><label class="form-label small mb-1">Resultado de la llamada</label>
                  <select class="form-select form-select-sm" name="resultado" required>
                    <option value="AGENDO">Agendó → abre Nueva cita con los datos de la indicación</option>
                    <option value="NO_CONTESTO">No contestó</option>
                    <option value="NO_LE_INTERESA">No le interesa → la indicación queda descartada</option>
                    <option value="NUMERO_INVALIDO">Número inválido</option>
                  </select></div>
                <div class="flex-grow-1"><label class="form-label small mb-1">Motivo u observación (obligatorio si no le interesa)</label>
                  <input class="form-control form-control-sm" name="observacion" maxlength="255"></div>
                <button class="btn btn-sm btn-success">Guardar</button>
              </form>
              <div class="small text-body-secondary mt-1" th:if="${i.indicaciones != null}" th:text="|Indicaciones del médico: ${i.indicaciones}|"></div>
            </td></tr>
            </th:block>
          </tbody>
        </table>
        </div>
      </div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
