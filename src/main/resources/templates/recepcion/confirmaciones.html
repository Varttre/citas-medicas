<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Confirmaciones')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('confirmaciones')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Confirmaciones</h1><p class="text-body-secondary mb-0" th:text="|Citas de las próximas ${horas} horas, ordenadas por proximidad|">Citas de las próximas 48 horas</p></div>
        <span class="badge text-bg-primary fs-6" th:text="${#lists.size(filas) == 1} ? '1 pendiente' : |${#lists.size(filas)} pendientes|">0 pendientes</span>
      </div>
      <form class="d-flex flex-wrap gap-2 mb-3" th:action="@{/recepcion/confirmaciones}" method="get">
        <input type="date" class="form-control" style="max-width:11rem" name="fecha" th:value="${fecha}" aria-label="Día">
        <select class="form-select" style="max-width:14rem" name="medico" aria-label="Médico">
          <option value="">Todos los médicos</option>
          <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="${m.nombre}" th:selected="${medico == m.idMedico}">Médico</option>
        </select>
        <select class="form-select" style="max-width:14rem" name="especialidad" aria-label="Especialidad">
          <option value="">Todas las especialidades</option>
          <option th:each="e : ${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombre}" th:selected="${especialidad == e.idEspecialidad}">Especialidad</option>
        </select>
        <button class="btn btn-outline-primary">Filtrar</button>
        <a class="btn btn-outline-secondary" th:href="@{/recepcion/confirmaciones}">Quitar filtros</a>
      </form>
      <div th:replace="~{fragmentos/cola :: tabla(${filas}, '/recepcion/confirmaciones', ${resultados}, 'Cita')}"></div>
      <p class="small text-body-secondary mt-2">Una cita que el paciente cancela desde el portal desaparece sola de esta cola. Las citas solo se confirman aquí, con la llamada registrada.</p>
    </main>
  </div>
</div>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
