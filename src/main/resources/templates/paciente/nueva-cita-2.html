<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Nueva cita')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('nueva-cita')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Nueva cita</h1></div>
      </div>
      <ol th:replace="~{paciente/pasos :: pasos(2)}"></ol>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h5 mb-3">Elige especialidad y médico</h2>
          <form class="row g-3 mb-4" th:action="@{/paciente/cita/nueva/2}" method="get">
            <div class="col-md-6"><label class="form-label" for="especialidad">Especialidad</label>
              <select class="form-select" id="especialidad" name="especialidad" onchange="this.form.submit()">
                <option value="">Todas</option>
                <option th:each="e : ${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombre}"
                        th:selected="${especialidad == e.idEspecialidad}">Cardiología</option>
              </select></div>
          </form>
          <div class="list-group">
            <a th:each="m : ${medicos}" th:href="@{/paciente/cita/nueva/4(medico=${m.idMedico}, especialidad=${m.idEspecialidad})}"
               class="list-group-item list-group-item-action d-flex align-items-center gap-3">
              <i class="bi bi-person-badge fs-4 text-primary"></i>
              <div class="flex-grow-1"><div class="fw-semibold" th:text="${m.nombre}">Médico</div>
                <div class="small text-body-secondary" th:text="${m.especialidad}">Especialidad</div></div>
              <i class="bi bi-chevron-right"></i>
            </a>
            <div th:if="${#lists.isEmpty(medicos)}" class="list-group-item text-body-secondary">No hay médicos para esa especialidad.</div>
          </div>
          <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/paciente/cita/nueva}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Atrás</a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
