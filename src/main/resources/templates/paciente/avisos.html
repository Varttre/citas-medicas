<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Avisos')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('avisos')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Avisos</h1><p class="text-body-secondary mb-0">Novedades del consultorio</p></div>
      </div>
      <div class="row g-4">
        <div class="col-md-6" th:each="a : ${avisos}">
          <div class="card shadow-sm h-100">
            <img th:src="${a.bannerUrl}" class="card-img-top" style="height: 9rem; object-fit: cover" th:alt="${a.titulo}">
            <div class="card-body">
              <h2 class="h5 card-title" th:text="${a.titulo}">Aviso</h2>
              <p class="card-text" th:text="${a.texto}">Texto</p>
            </div>
            <div class="card-footer bg-body border-0 pb-3 d-flex flex-wrap gap-2">
              <a th:href="@{/paciente/avisos/{id}(id=${a.idAviso})}" class="btn btn-outline-primary">Ver aviso</a>
              <a th:if="${#strings.startsWith(a.enlace, '/')}" th:href="@{${a.enlace}}" class="btn btn-link">Conocer más</a>
              <a th:unless="${#strings.startsWith(a.enlace, '/')}" th:href="${a.enlace}" target="_blank" rel="noopener" class="btn btn-link">Conocer más <i class="bi bi-box-arrow-up-right ms-1"></i></a>
            </div>
          </div>
        </div>
      </div>
      <p th:if="${#lists.isEmpty(avisos)}" class="text-body-secondary">El consultorio no tiene avisos por ahora.</p>
    </main>
  </div>
</div>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
