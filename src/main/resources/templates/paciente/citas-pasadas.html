<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Citas pasadas')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('mis-citas')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Citas pasadas</h1><p class="text-body-secondary mb-0">Historial de tus citas y las que agendaste para otras personas</p></div>
        <a th:href="@{/paciente/citas}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Mis citas</a>
      </div>
      <div class="card shadow-sm mb-3" th:each="c : ${citas}"><div class="card-body d-flex flex-wrap justify-content-between gap-2">
        <div><div class="fw-semibold" th:text="|${c.especialidad} · ${c.medico}|">Especialidad · Médico</div>
          <div class="small text-body-secondary" th:text="|${#temporals.format(c.inicio, 'EEEE d ''de'' MMMM, HH:mm')} · ${c.tipo} · ${c.modalidad == 'PRESENCIAL' ? 'Presencial' : 'Teleconsulta'}|">fecha</div></div>
        <span class="badge text-bg-light border align-self-start" th:text="${c.estado}">Realizada</span>
      </div></div>
      <p th:if="${#lists.isEmpty(citas)}" class="text-center text-body-secondary my-4">Aún no tienes citas pasadas.</p>
    </main>
  </div>
</div>

<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
