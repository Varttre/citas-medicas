<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Nueva cita')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('nueva-cita')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">Nueva cita</h1></div>
      </div>
      <ol th:replace="~{paciente/pasos :: pasos(1)}"></ol>
      <form class="card shadow-sm" th:action="@{/paciente/cita/nueva}" method="post"
            th:with="t=${tercero}, otra=${tercero != null or para.tercero or terceroElegido != null},
                     nuevo=${tercero != null or #lists.isEmpty(terceros)},
                     sel=${terceroElegido}">
        <div class="card-body p-4">
          <h2 class="h5 mb-3">¿Para quién es la cita?</h2>
          <div class="row g-3 mb-2">
            <div class="col-md-6">
              <input type="radio" class="btn-check" name="paraQuien" value="MI" id="pq-mi" th:checked="${!otra}" data-oculta="#otra-persona">
              <label class="btn btn-outline-primary w-100 text-start p-3" for="pq-mi">
                <i class="bi bi-person fs-4 d-block mb-1"></i><span class="fw-semibold">Para mí</span>
                <span class="d-block small" th:text="${propio}">Paciente</span>
              </label>
            </div>
            <div class="col-md-6">
              <input type="radio" class="btn-check" name="paraQuien" value="OTRA" id="pq-otra" th:checked="${otra}" data-muestra="#otra-persona">
              <label class="btn btn-outline-primary w-100 text-start p-3" for="pq-otra">
                <i class="bi bi-people fs-4 d-block mb-1"></i><span class="fw-semibold">Para otra persona</span>
                <span class="d-block small">Un familiar o alguien a tu cargo</span>
              </label>
            </div>
          </div>

          <div id="otra-persona" class="border-top pt-4 mt-4" th:classappend="${!otra} ? 'd-none'">
            <!-- Primero, las personas que la cuenta ya tiene; si es alguien nuevo, se añade aquí mismo -->
            <th:block th:if="${!#lists.isEmpty(terceros)}">
              <h3 class="h6">¿Para cuál de tus terceros?</h3>
              <div class="list-group mb-3">
                <label class="list-group-item d-flex gap-3 align-items-center" th:each="x : ${terceros}">
                  <input class="form-check-input flex-shrink-0" type="radio" name="idTercero" th:value="${x.idPaciente}"
                         th:checked="${!nuevo and x.idPaciente == sel}" data-oculta="#datos-nuevo">
                  <span><span class="fw-semibold" th:text="${x.nombre}">Nombre</span>
                    <span class="d-block small text-body-secondary" th:text="|${x.parentesco != null ? x.parentesco + ' · ' : ''}${x.tipoDocumento} ${x.nroDocumento} · ${x.edad} años|">DNI</span></span>
                </label>
                <label class="list-group-item d-flex gap-3 align-items-center">
                  <input class="form-check-input flex-shrink-0" type="radio" name="idTercero" value="NUEVO" id="tercero-nuevo"
                         th:checked="${nuevo}" data-muestra="#datos-nuevo">
                  <span><span class="fw-semibold"><i class="bi bi-person-plus me-1"></i>Otra persona</span>
                    <span class="d-block small text-body-secondary">Añádela ahora; quedará en «Mis terceros»</span></span>
                </label>
              </div>
            </th:block>
            <input type="hidden" name="idTercero" value="NUEVO" th:if="${#lists.isEmpty(terceros)}">

            <div id="datos-nuevo" th:classappend="${!nuevo} ? 'd-none'">
            <h3 class="h6">Datos del paciente</h3>
            <div class="row g-3">
              <div class="col-sm-5 col-lg-3"><label class="form-label" for="t-tipo">Tipo de documento</label>
                <select class="form-select" id="t-tipo" name="tipoDocumento">
                  <option th:each="d : ${tiposDocumento}" th:value="${d}" th:selected="${t != null and t.tipoDocumento() == d}"
                          th:text="${d.name() == 'DNI'} ? 'DNI' : (${d.name() == 'CE'} ? 'Carné de extranjería' : 'Pasaporte')">DNI</option>
                </select></div>
              <div class="col-sm-7 col-lg-3"><label class="form-label" for="t-nro">Número de documento</label><input class="form-control" id="t-nro" name="nroDocumento" maxlength="20" th:value="${t?.nroDocumento()}"></div>
              <div class="col-sm-6 col-lg-3"><label class="form-label" for="t-nom">Nombres</label><input class="form-control" id="t-nom" name="nombres" maxlength="80" th:value="${t?.nombres()}"></div>
              <div class="col-sm-6 col-lg-3"><label class="form-label" for="t-ape">Apellidos</label><input class="form-control" id="t-ape" name="apellidos" maxlength="80" th:value="${t?.apellidos()}"></div>
              <div class="col-sm-6 col-lg-3"><label class="form-label" for="t-nac">Fecha de nacimiento</label><input type="date" class="form-control" id="t-nac" name="fechaNacimiento" th:value="${t?.fechaNacimiento()}"></div>
              <div class="col-sm-6 col-lg-3"><label class="form-label" for="t-par">Parentesco <span class="text-body-secondary">(opcional)</span></label>
                <select class="form-select" id="t-par" name="parentesco">
                  <option value="">Sin indicar</option>
                  <option th:each="pa : ${parentescos}" th:value="${pa}" th:text="${pa.texto}" th:selected="${t != null and t.parentesco() == pa}">Hijo/a</option>
                </select></div>
              <div class="col-sm-6 col-lg-3"><label class="form-label" for="t-tel">Teléfono <span class="text-body-secondary">(opcional)</span></label><input type="tel" class="form-control" id="t-tel" name="telefono" maxlength="20" th:value="${t?.telefono()}"></div>
            </div>
            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="consentimiento" name="consentimiento" value="true">
              <label class="form-check-label" for="consentimiento">Declaro tener el consentimiento del paciente para agendar citas a su nombre.</label>
            </div>
            </div>
            <p class="small text-body-secondary mt-2 mb-0"><i class="bi bi-telephone me-1"></i>Por las citas que agendes para esta persona, el consultorio te llamará a ti.</p>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <button th:replace="~{paciente/pasos :: botonCancelar}"></button>
            <button class="btn btn-primary">Continuar<i class="bi bi-arrow-right ms-1"></i></button>
          </div>
        </div>
      </form>
      <div th:replace="~{paciente/pasos :: modalCancelar}"></div>
    </main>
  </div>
</div>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
