<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('WhatsApp')}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('whatsapp')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-0">WhatsApp del consultorio</h1><p class="text-body-secondary mb-0">Escríbenos por WhatsApp; el mensaje ya incluye tus datos</p></div>
        
      </div>
      <div class="alert alert-light border" th:if="${#lists.isEmpty(opciones)}">
        <i class="bi bi-info-circle me-1"></i>El consultorio todavía no tiene un número de WhatsApp disponible. Puedes llamar a recepción.
      </div>
      <div class="card shadow-sm" th:unless="${#lists.isEmpty(opciones)}"><div class="card-body p-4">
        <h2 class="h6 mb-3">¿Sobre qué quieres consultar?</h2>
        <div class="list-group">
          <a th:each="o : ${opciones}" th:href="${o.enlace}" target="_blank" rel="noopener" class="list-group-item list-group-item-action d-flex gap-3 align-items-start">
            <i class="bi bi-whatsapp text-success fs-4"></i>
            <span><span class="fw-semibold d-block" th:text="${o.motivo}">Motivo</span>
              <span class="small text-body-secondary" th:text="|Mensaje: «${o.mensaje}»|">Mensaje</span></span>
          </a>
        </div>
        <p class="small text-body-secondary mt-3 mb-0">Se abre WhatsApp con el mensaje listo; solo tienes que enviarlo.</p>
      </div></div>
    </main>
  </div>
</div>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
