<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head(${avisoDetalle.titulo})}"></head>
<body class="bg-body-tertiary">
<div class="d-lg-flex">
  <aside th:replace="~{fragmentos/barra :: barra('avisos')}"></aside>

  <div class="flex-grow-1">
    <nav th:replace="~{fragmentos/base :: navbarMovil}"></nav>

    <main class="container-xl p-3 p-lg-4 pagina-angosta">
      <div th:replace="~{fragmentos/base :: mensajes}"></div>
      <nav aria-label="Ruta" class="mb-3">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a th:href="@{/paciente/inicio}">Inicio</a></li>
          <li class="breadcrumb-item"><a th:href="@{/paciente/avisos}">Avisos</a></li>
          <li class="breadcrumb-item active" aria-current="page" th:text="${avisoDetalle.titulo}">Aviso</li>
        </ol>
      </nav>

      <article class="card shadow-sm">
        <img th:src="${avisoDetalle.bannerUrl}" class="card-img-top" style="height: 12rem; object-fit: cover" th:alt="${avisoDetalle.titulo}">
        <div class="card-body p-4">
          <h1 class="h3 card-title" th:text="${avisoDetalle.titulo}">Aviso</h1>
          <p class="card-text fs-6" th:text="${avisoDetalle.texto}">Texto</p>
        </div>
        <div class="card-footer bg-body border-0 px-4 pb-4 d-flex flex-wrap gap-2">
          <!-- Un enlace interno se abre en la misma pestaña; uno externo, en otra -->
          <a th:if="${#strings.startsWith(avisoDetalle.enlace, '/')}" th:href="@{${avisoDetalle.enlace}}" class="btn btn-primary">Conocer más</a>
          <a th:unless="${#strings.startsWith(avisoDetalle.enlace, '/')}" th:href="${avisoDetalle.enlace}" target="_blank" rel="noopener"
             class="btn btn-primary">Conocer más <i class="bi bi-box-arrow-up-right ms-1"></i></a>
          <a th:href="@{/paciente/avisos}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Todos los avisos</a>
        </div>
      </article>
    </main>
  </div>
</div>


<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
